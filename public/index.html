<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CAR CLASH</title>
<style>
:root{--bg:#10192c;--panel:#1d2b48;--line:#6f91c4;--gold:#ffe18a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:white;font-family:system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
button,input{font:inherit}
input{-webkit-user-select:text;user-select:text}
button{border:2px solid #d8e8ff;border-radius:13px;background:#304d78;color:white;font-weight:800;padding:11px 15px;touch-action:none;cursor:pointer}
button:active{transform:scale(.97);background:#456b9f}
button.primary{background:#b35b42;border-color:#ffe0b0}
.hidden{display:none!important}
#app{height:100%;width:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow:auto;padding:16px;background:linear-gradient(145deg,#10192c,#243c5c);touch-action:pan-y}
.panel{max-width:760px;margin:auto;background:#1b2a46ed;border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 15px 45px #0006}
h1{font-size:clamp(38px,9vw,66px);line-height:1;margin:8px 0;color:var(--gold);text-align:center;text-shadow:4px 5px #693d48}
h2{margin:4px 0 12px;color:var(--gold)}
p{line-height:1.55;color:#e4efff}
.sub{text-align:center;color:#b9d4ef}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.field{display:block;width:100%;background:#0d172a;border:1px solid #6f91c4;color:white;border-radius:10px;padding:11px;margin:6px 0 12px}
#menu,#editor{display:flex;align-items:center;justify-content:center}
#menu .panel{width:min(100%,560px);text-align:center}
#editor .panel{width:min(100%,760px)}
#drawCanvas{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#eaf1f7;background-image:radial-gradient(#c4d4e4 1px,transparent 1px);background-size:18px 18px;border:3px solid #a9c9e9;border-radius:12px;touch-action:none}
#inkTrack{height:14px;background:#091426;border-radius:20px;overflow:hidden;border:1px solid #7896bd;flex:1}
#inkFill{height:100%;width:100%;background:linear-gradient(90deg,#63e6b3,#ffdc72)}
.small{font-size:12px;color:#b8cce8}
#gameScreen{position:absolute;inset:0;background:#17263e;overflow:hidden;touch-action:none;overscroll-behavior:none}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.hudbox{background:#10192cdd;border:1px solid #9dbbe2;border-radius:12px;padding:8px 11px;font-size:13px;font-weight:800}
#touchControls{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none;z-index:3}
.touchgroup{display:flex;gap:8px;pointer-events:auto}
.touchbtn{width:clamp(54px,15vw,76px);height:clamp(54px,15vw,76px);border-radius:50%;font-size:22px;background:#203b63df;box-shadow:0 4px 0 #0a1427;touch-action:none}
.touchbtn.boost{background:#a84e3bdf}
.touchbtn.pressed{transform:scale(.94);filter:brightness(1.25)}
#deathOverlay{position:absolute;inset:0;z-index:8;background:#050912eF;display:flex;align-items:center;justify-content:center;pointer-events:none}
#deathVideo{width:100%;height:100%;object-fit:cover}
#deathLabel{position:absolute;top:12%;left:0;right:0;text-align:center;font-size:clamp(28px,8vw,64px);font-weight:1000;color:#ff4c4c;text-shadow:0 4px 18px #000}
#spectateTag{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#10192ce8;border:1px solid #ff7777;border-radius:14px;padding:9px 15px;font-weight:900;z-index:4;white-space:nowrap}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07101dcc;padding:16px;z-index:10}
#result .panel{text-align:center;width:min(100%,420px)}
@media(min-width:800px){.touchbtn{width:70px;height:70px}}
</style>
</head>
<body>
<div id="app">
<section id="menu" class="screen">
 <div class="panel">
  <h1>CAR CLASH</h1>
  <p class="sub">DRAW YOUR CAR. BUMP YOUR RIVALS.</p>
  <p>自分で描いた車で、相手をステージの外へ押し出そう！</p>
  <label>プレイヤー名<input id="playerName" class="field" maxlength="16" placeholder="プレイヤー"></label>
  <div class="row"><button id="toEditor" class="primary">車を描く・編集</button><button id="quickPlay">対戦スタート</button></div>
  <p class="small">1人のときはCPUが3台参加。2人以上でCPUは退出します。</p>
 </div>
</section>

<section id="editor" class="screen hidden">
 <div class="panel">
  <h2>🎨 MY CAR STUDIO</h2>
  <p class="small">横向きの車を描こう！描くとインクを使います。消しゴムで消すと少し回復します。</p>
  <canvas id="drawCanvas" width="800" height="450"></canvas>
  <div class="row" style="margin-top:10px"><b id="inkText">インク 100%</b><div id="inkTrack"><div id="inkFill"></div></div></div>
  <div class="row" style="margin-top:10px"><button id="penBtn" class="primary">✏️ ペン</button><button id="eraserBtn">消しゴム</button><button id="clearBtn">全部消す</button></div>
  <div class="row" style="margin-top:10px"><button id="backMenu">戻る</button><button id="saveCar" class="primary">この車で対戦！</button></div>
 </div>
</section>

<section id="gameScreen" class="hidden">
 <canvas id="gameCanvas" width="1200" height="700"></canvas>
 <div id="hud"><div class="hudbox" id="hudState">CAR CLASH</div><div class="hudbox" id="hudPlayers">接続中…</div></div>
 <div id="spectateTag" class="hidden">SPECTATING｜観戦中</div>
 <div id="touchControls">
  <div class="touchgroup"><button class="touchbtn" data-input="left">◀</button><button class="touchbtn" data-input="right">▶</button></div>
  <div class="touchgroup"><button class="touchbtn" data-input="jump">⤒</button><button class="touchbtn boost" data-input="boost">BOOST</button></div>
 </div>
 <div id="deathOverlay" class="hidden">
  <video id="deathVideo" src="DEATH.MP4" playsinline webkit-playsinline preload="auto"></video>
  <div id="deathLabel">YOU ARE OUT</div>
 </div>
 <div id="result" class="hidden"><div class="panel"><h2 id="resultTitle">BATTLE OVER</h2><p id="resultText"></p><p class="small">ホーム画面へ戻ります…</p></div></div>
</section>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const SERVER_URL="https://car-clash-pwbt.onrender.com";
const screens=["menu","editor"];
const gc=$("gameCanvas"),g=gc.getContext("2d",{alpha:false});
let socket=null,myId=null,savedCar="",gameOver=false,deadShown=false;
let ink=100,tool="pen",drawing=false,last=null;
let previousState=null,currentState=null,stateReceivedAt=0;
let cameraX=600,cameraY=350,cameraZoom=1,shake=0,lastFrame=performance.now();
let canvasReady=false,lastCanvasWidth=0,lastCanvasHeight=0;
let input={left:false,right:false,jump:false,boost:false};
const carCache={};

function show(id){
 screens.forEach(s=>$(s).classList.toggle("hidden",s!==id));
 $("gameScreen").classList.toggle("hidden",id!=="gameScreen");
 if(id==="gameScreen")requestAnimationFrame(()=>{resizeCanvas();lastFrame=performance.now()});
}
function resizeCanvas(){
 const r=gc.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);
 const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
 if(gc.width!==w||gc.height!==h){gc.width=w;gc.height=h}
 g.setTransform(gc.width/1200,0,0,gc.height/700,0,0);
 lastCanvasWidth=r.width;lastCanvasHeight=r.height;canvasReady=true;
}

const dc=$("drawCanvas"),dctx=dc.getContext("2d");
function setInk(v){
 ink=Math.max(0,Math.min(100,v));
 $("inkText").textContent="インク "+Math.round(ink)+"%";
 $("inkFill").style.width=ink+"%";
 $("inkFill").style.background=ink<20?"#ff6868":"linear-gradient(90deg,#63e6b3,#ffdc72)";
}
function pointerPos(e){
 const r=dc.getBoundingClientRect();
 return{x:(e.clientX-r.left)*dc.width/r.width,y:(e.clientY-r.top)*dc.height/r.height};
}
dc.addEventListener("pointerdown",e=>{
 e.preventDefault();drawing=true;
 try{dc.setPointerCapture(e.pointerId)}catch(_){}
 last=pointerPos(e);
});
dc.addEventListener("pointermove",e=>{
 if(!drawing)return;e.preventDefault();
 const p=pointerPos(e),dist=Math.hypot(p.x-last.x,p.y-last.y);
 if(tool==="pen"&&ink<=0){last=p;return}
 dctx.save();dctx.lineCap="round";dctx.lineJoin="round";dctx.lineWidth=tool==="pen"?22:42;
 if(tool==="eraser"){dctx.globalCompositeOperation="destination-out";setInk(ink+dist*.055)}
 else{dctx.globalCompositeOperation="source-over";dctx.strokeStyle="#172b43";setInk(ink-dist*.045)}
 dctx.beginPath();dctx.moveTo(last.x,last.y);dctx.lineTo(p.x,p.y);dctx.stroke();dctx.restore();last=p;
});
function stopDraw(){drawing=false;last=null}
["pointerup","pointercancel","lostpointercapture"].forEach(e=>dc.addEventListener(e,stopDraw));
$("penBtn").onclick=()=>{tool="pen";$("penBtn").classList.add("primary");$("eraserBtn").classList.remove("primary")};
$("eraserBtn").onclick=()=>{tool="eraser";$("eraserBtn").classList.add("primary");$("penBtn").classList.remove("primary")};
$("clearBtn").onclick=()=>{dctx.clearRect(0,0,dc.width,dc.height);setInk(100)};
function carImage(){
 const c=document.createElement("canvas");c.width=400;c.height=225;
 c.getContext("2d").drawImage(dc,0,0,400,225);
 for(const q of [.65,.5,.35]){
  const v=c.toDataURL("image/webp",q);
  if(v.startsWith("data:image/webp")&&v.length<180000)return v;
 }
 const png=c.toDataURL("image/png");
 if(png.length<180000)return png;
 alert("車の画像が大きすぎます。少しシンプルに描いてください。");return "";
}
$("toEditor").onclick=()=>show("editor");
$("backMenu").onclick=()=>show("menu");
$("saveCar").onclick=()=>{const v=carImage();if(v){savedCar=v;startGame()}};
$("quickPlay").onclick=()=>{if(!savedCar){savedCar=carImage();if(!savedCar)return}startGame()};

function resetRender(){
 previousState=null;currentState=null;cameraX=600;cameraY=350;
 cameraZoom=1;shake=0;deadShown=false;gameOver=false;
 $("deathOverlay").classList.add("hidden");
 $("spectateTag").classList.add("hidden");
 $("result").classList.add("hidden");
 $("deathVideo").pause();$("deathVideo").currentTime=0;
 Object.keys(carCache).forEach(k=>delete carCache[k]);
}
function startGame(){
 if(typeof io==="undefined"){alert("通信ライブラリを読み込めません。ネット接続を確認してください。");return}
 if(socket){socket.disconnect();socket=null}
 resetRender();show("gameScreen");
 $("hudState").textContent="サーバーに接続中…";
 socket=io(SERVER_URL,{transports:["websocket","polling"],timeout:20000,reconnection:true});
 socket.on("connect",()=>{
  myId=socket.id;
  socket.emit("join",{name:$("playerName").value.trim()||"PLAYER",car:savedCar||carImage()});
  $("hudState").textContent="ARENA CONNECTED";
 });
 socket.on("connect_error",()=>{$("hudState").textContent="接続エラー：サーバー起動を待っています"});
 socket.on("disconnect",()=>{if(!gameOver)$("hudState").textContent="通信が切れました"});
 socket.on("joined",d=>{myId=d.id});
 socket.on("carUpdate",d=>{
  if(!d||!d.id||typeof d.car!=="string")return;
  const im=new Image();im.onload=()=>carCache[d.id]=im;im.src=d.car;
 });
 socket.on("carRemove",d=>{if(d&&d.id)delete carCache[d.id]});
 socket.on("state",s=>{if(s&&Array.isArray(s.players))receiveState(s)});
 socket.on("matchEnd",d=>{
  gameOver=true;releaseAllInputs();
  $("resultTitle").textContent=d.winnerId===myId?"🏆 YOU WIN!":"BATTLE OVER";
  $("resultText").textContent=d.message||"対戦終了！";
  $("result").classList.remove("hidden");
  $("touchControls").classList.add("hidden");
  setTimeout(()=>{
   if(socket){socket.disconnect();socket=null}
   releaseAllInputs();show("menu");resetRender();
   $("touchControls").classList.remove("hidden");
  },4500);
 });
 socket.on("message",m=>{$("hudState").textContent=m.text||"サーバーメッセージ"});
 requestAnimationFrame(()=>resizeCanvas());
}

function sendInput(){if(socket&&socket.connected&&!gameOver&&!deadShown)socket.emit("input",input)}
function releaseAllInputs(){
 Object.keys(input).forEach(k=>input[k]=false);
 document.querySelectorAll("[data-input]").forEach(b=>b.classList.remove("pressed"));
 sendInput();
}
document.querySelectorAll("[data-input]").forEach(b=>{
 const k=b.dataset.input;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();if(deadShown||gameOver)return;
  try{b.setPointerCapture(e.pointerId)}catch(_){}
  input[k]=true;b.classList.add("pressed");sendInput();
 });
 const up=e=>{e.preventDefault();input[k]=false;b.classList.remove("pressed");sendInput()};
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,up));
});
window.addEventListener("blur",releaseAllInputs);
document.addEventListener("visibilitychange",()=>{if(document.hidden)releaseAllInputs()});

function showDeath(){
 if(deadShown)return;
 deadShown=true;releaseAllInputs();
 $("spectateTag").classList.remove("hidden");
 $("deathOverlay").classList.remove("hidden");
 const v=$("deathVideo");
 v.currentTime=0;
 const play=v.play();
 if(play&&play.catch)play.catch(()=>{$("deathLabel").textContent="YOU ARE OUT"});
 v.onended=()=>{$("deathOverlay").classList.add("hidden")};
 setTimeout(()=>$("deathOverlay").classList.add("hidden"),2300);
}
function receiveState(s){
 previousState=currentState||s;currentState=s;stateReceivedAt=performance.now();
 const me=s.players.find(p=>p.id===myId);
 if(me&&!me.alive&&!deadShown)showDeath();
 if(me&&me.impact>.45)shake=Math.max(shake,me.impact*9);
}
function getSmoothState(now){
 if(!currentState)return null;
 if(!previousState)return currentState;
 const elapsed=Math.max(0,now-stateReceivedAt);
 const alpha=Math.max(0,Math.min(1,elapsed/33.33));
 const old=new Map((previousState.players||[]).map(p=>[p.id,p]));
 const players=currentState.players.map(p=>{
  const o=old.get(p.id);if(!o)return p;
  const extra=Math.min(elapsed/1000,.045);
  return {...p,
   x:o.x+((p.x+(p.vx||0)*extra)-o.x)*alpha,
   y:o.y+((p.y+(p.vy||0)*extra)-o.y)*alpha,
   angle:o.angle+(p.angle-o.angle)*alpha,
   squash:o.squash+(p.squash-o.squash)*alpha
  };
 });
 return {...currentState,players};
}

const bg=new Image();bg.src="city.JPG";
let bgReady=false;bg.onload=()=>bgReady=true;

function drawBackground(){
 // 背景はステージ内だけに描画し、外側へ引き伸ばさない
 g.fillStyle="#080d18";g.fillRect(-500,-100,2200,900);
 if(bgReady)g.drawImage(bg,0,0,1200,500);
 else{const gr=g.createLinearGradient(0,0,0,500);gr.addColorStop(0,"#83c9e9");gr.addColorStop(1,"#d9e9ee");g.fillStyle=gr;g.fillRect(0,0,1200,500)}
 g.fillStyle="#46515b";g.fillRect(0,500,1200,200);
 g.fillStyle="#e6d4a5";g.fillRect(0,500,1200,12);
 g.fillStyle="#f8e6a8";for(let x=40;x<1200;x+=150)g.fillRect(x,600,75,7);
 g.fillStyle="#263746";g.fillRect(0,512,1200,8);
 g.fillStyle="#fff";g.font="bold 16px sans-serif";g.textAlign="left";g.fillText("ARENA STREET",24,540);
 // 両端に明確なDEATHゾーンを設置
 g.save();
 const edge=(x,flip)=>{
  g.translate(x,0);if(flip)g.scale(-1,1);
  g.fillStyle="#240d19";g.fillRect(-24,0,24,700);
  g.fillStyle="#e52e45";g.fillRect(-24,0,5,700);
  g.globalAlpha=.25;g.fillStyle="#ff344f";
  for(let y=0;y<700;y+=28)g.fillRect(-24,y,24,12);
  g.globalAlpha=1;g.fillStyle="#fff";g.font="900 18px sans-serif";
  g.translate(-13,350);g.rotate(-Math.PI/2);g.textAlign="center";g.fillText("DEATH ZONE",0,0);
 };
 edge(0,false);edge(1200,true);g.restore();
}
function drawCar(p){
 g.save();g.translate(p.x,p.y);
 const squash=Math.max(.62,Math.min(1.12,p.squash||1));
 g.rotate(p.angle||0);g.scale(p.facing<0?-1:1,1);g.scale(1/squash,squash);
 g.fillStyle="#17202b66";g.beginPath();g.ellipse(0,27,52,8,0,0,Math.PI*2);g.fill();
 g.fillStyle="#171c25";g.beginPath();g.arc(-25,12,15,0,Math.PI*2);g.arc(26,12,15,0,Math.PI*2);g.fill();
 g.fillStyle="#c8d7e5";g.beginPath();g.arc(-25,12,6,0,Math.PI*2);g.arc(26,12,6,0,Math.PI*2);g.fill();
 const im=carCache[p.id];
 if(im&&im.complete&&im.naturalWidth)g.drawImage(im,-52,-49,104,58);
 else{g.fillStyle=p.color||"#f5b84a";g.fillRect(-48,-28,96,38);g.fillStyle="#d5efff";g.fillRect(-15,-48,38,24)}
 if((p.impact||0)>.35){
  g.globalAlpha=Math.min(.65,p.impact*.7);g.strokeStyle="#fff4b2";g.lineWidth=4;
  for(let i=0;i<3;i++){g.beginPath();g.moveTo(-58-i*8,-18+i*12);g.lineTo(-85-i*12,-18+i*12);g.stroke()}
 }
 g.restore();
}
function drawPlayerName(p){
 g.save();g.fillStyle="#102036";g.fillRect(p.x-34,p.y-65,68,7);
 g.fillStyle=p.human?"#7ce5ee":"#ffd36c";g.fillRect(p.x-34,p.y-65,68,7);
 g.fillStyle="#fff";g.font="bold 15px sans-serif";g.textAlign="center";g.fillText(p.name,p.x,p.y-75);g.restore();
}
function updateCamera(players,dt){
 let target=players.find(p=>p.id===myId&&p.alive);
 // 自分が脱落したら、生き残っている相手を追いかけて観戦
 if(!target)target=players.find(p=>p.alive);
 if(target){
  const tx=Math.max(0,Math.min(1200,target.x+(target.vx||0)*8));
  const ty=350+Math.max(-35,Math.min(45,(target.y-464)*.12));
  cameraX+=(tx-cameraX)*Math.min(1,dt*5);
  cameraY+=(ty-cameraY)*Math.min(1,dt*4);
  const z=Math.max(.88,Math.min(1.05,1-Math.abs(target.vx||0)*.006));
  cameraZoom+=(z-cameraZoom)*Math.min(1,dt*3);
 }
}
function drawGame(s,dt){
 updateCamera(s.players||[],dt);
 shake*=.82;if(shake<.15)shake=0;
 g.save();
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 g.translate(600+sx,350+sy);g.scale(cameraZoom,cameraZoom);g.translate(-cameraX,-cameraY);
 drawBackground();
 for(const p of s.players||[])if(p.alive){drawCar(p);drawPlayerName(p)}
 g.restore();
 $("hudState").textContent=s.status||"BUMP! STAY ON THE STREET";
 $("hudPlayers").textContent="参加 "+s.players.filter(p=>p.human).length+"人 / 残り "+s.players.filter(p=>p.alive).length+"台";
}
function renderLoop(now){
 const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
 if(!$("gameScreen").classList.contains("hidden")){
  const r=gc.getBoundingClientRect();
  if(!canvasReady||Math.abs(r.width-lastCanvasWidth)>1||Math.abs(r.height-lastCanvasHeight)>1)resizeCanvas();
  if(currentState){const s=getSmoothState(now);if(s)drawGame(s,dt)}
  else{g.fillStyle="#10192c";g.fillRect(0,0,1200,700);g.fillStyle="#fff";g.font="bold 28px sans-serif";g.textAlign="center";g.fillText("CONNECTING TO ARENA...",600,350)}
 }
 requestAnimationFrame(renderLoop);
}
window.addEventListener("resize",()=>{if(!$("gameScreen").classList.contains("hidden"))resizeCanvas()});
if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>{if(!$("gameScreen").classList.contains("hidden"))resizeCanvas()});
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input"))e.preventDefault()});
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
 const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;
},{passive:false});
requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
